<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AND Logic Gate</title>

    <!-- CSS file -->
    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <h1>
            Fundamentals of Computing
        </h1>

    </header>



    <!-- =========================
         MAIN CONTAINER
    ========================== -->

    <div class="container">


        <!-- =========================
             NAVIGATION
        ========================== -->

        <nav>

            <a href="index.html">
                Project
            </a>

            <a href="#">
                Concepts
            </a>

            <a href="#">
                Database
            </a>

            <a href="#">
                Documentation
            </a>

            <a href="#">
                Dev Team
            </a>

            <a href="animation.html">
                Animation
            </a>

        </nav>



        <!-- =========================
             MAIN CONTENT
        ========================== -->

        <main>

            <div class="animation-section">


                <h2>
                    Final Project AND Logic Gate
                </h2>



                <!-- =========================
                     AND GATE IMAGE
                ========================== -->

                <div class="gate-image-container">

                    <img
                        id="gateImage"
                        src="and2off1.png"
                        alt="AND Logic Gate"
                        >

                </div>



                <!-- =========================
                     BUTTONS
                ========================== -->

                <div class="buttons">


                    <button onclick="changeGate('00')">
                        0 AND 0
                    </button>


                    <button onclick="changeGate('01')">
                        0 AND 1
                    </button>


                    <button onclick="changeGate('10')">
                        1 AND 0
                    </button>


                    <button onclick="changeGate('11')">
                        1 AND 1
                    </button>


                </div>



                <!-- =========================
                     BACK TO HOME
                ========================== -->

                <div class="back-link">

                    <a href="index.html">
                        Back to Home
                    </a>

                </div>


            </div>

        </main>


        <!-- Right side -->
        <div class="right-space"></div>


    </div>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            @ Powered by UB
        </p>

    </footer>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>


    function changeGate(input) {

        const gateImage = document.getElementById("gateImage");

        if (input === "00") {
            gateImage.src = "and2off1.png";
        }

        else if (input === "01") {
            gateImage.src = "andoffon1.png";
        }

        else if (input === "10") {
            gateImage.src = "andonoff1.png";
        }

        else if (input === "11") {
            gateImage.src = "and2on1.png";
        }

    }

</script>

</body>

</html>
