<!DOCTYPE html>
<html>

<head>
    <title>Project 1: Not Gate</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="not-gate-page">

    <header>
        <h1>Project 1: Not Gate</h1>
    </header>

    <main>

        <div class="input">

            <h2>Input</h2>

            <button onclick="document.getElementById('myImage').src='noton2.png'">
                ON
            </button>

            <button onclick="document.getElementById('myImage').src='notoff2.png'">
                OFF
            </button>

        </div>


        <div class="output">

            <h2>Output</h2>

            <div class="gate-box">

                <span class="input-value"></span>

                <img id="myImage" src="noton2.png">

                <span class="output-value"></span>

            </div>

        </div>

    </main>


    <footer>

        <a href="project.html">Back to Home</a>

        <p>@ Powered by UB</p>

    </footer>

</body>
</html>
