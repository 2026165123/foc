<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Simple Interactive Machine Language</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- =========================
         HEADER
    ========================== -->
    <header>
        <h1>Project 7: A Simple Machine Language</h1>
    </header>

    <!-- =========================
         MAIN CONTAINER
    ========================== -->
    <div class="container">

        <!-- =========================
             NAVIGATION
        ========================== -->
        <nav>
            <a href="index.html">Course</a>
            <a href="project.html">Project</a>
            <a href="concept.html">Concepts</a>
            <a href="database.html">Database</a>
            <a href="doc.html">Documentation</a>
            <a href="dev.html">Dev Team</a>
        </nav>

        <!-- =========================
             MAIN CONTENT AREA
        ========================== -->
        <main>
            <div class="animation-section">
                
                <h2>Interactive Machine Language Instruction Simulator</h2>

                <div class="machine-container">
                    
                    <!-- INSTRUCTION BUTTONS -->
                    <div class="machine-controls">
                        <button type="button" class="machine-btn" onclick="showInstruction('156C', 'Load register 5 with the bit pattern found in the memory cell at address 6C.', 'ML1.png', this)">156C</button>
                        <button type="button" class="machine-btn" onclick="showInstruction('166D', 'Load register 6 with the bit pattern found in memory cell 6D.', 'ML2.png', this)">166D</button>
                        <button type="button" class="machine-btn" onclick="showInstruction('5056', 'ADD the contents of register 5 and register 6 and place result in register 0.', 'ML3.png', this)">5056</button>
                        <button type="button" class="machine-btn" onclick="showInstruction('306E', 'STORE the contents of register 0 at memory cell 6E.', 'ML4.png', this)">306E</button>
                        <button type="button" class="machine-btn" onclick="showInstruction('C000', 'HALT program execution.', 'ML5.png', this)">C000</button>
                    </div>

                    <!-- DISPLAY & EXPLANATION -->
                    <div class="machine-display-area">
                        <div id="explanationText" class="machine-explanation">
                            Click any instruction button on the left to see its operation breakdown.
                        </div>

                        <div class="gate-image-container">
                            <img id="machineDiagram" class="wide-img" src="MLblank.png" alt="Machine Language Architecture Diagram">
                        </div>
                    </div>

                </div>

            </div>
        </main>

        <!-- RIGHT SPACER TO CENTER CONTENT -->
        <div class="right-space"></div>

    </div>

    <!-- =========================
         FOOTER
    ========================== -->
    <footer>
        <p><a href="project.html">Back to Home</a></p>
        <p>@ Powered by UB</p>
    </footer>

    <!-- =========================
         INTERACTIVE SCRIPT
    ========================== -->
    <script>
        function showInstruction(code, description, imageSrc, btnElement) {
            // Update explanation text and diagram image
            document.getElementById('explanationText').innerText = code + ": " + description;
            document.getElementById('machineDiagram').src = imageSrc;

            // Highlight active button
            let buttons = document.querySelectorAll('.machine-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }
    </script>

</body>
</html>
