<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 2: AND Gate</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- =========================
         HEADER
    ========================== -->
    <header>
        <h1>Project 2: AND Gate</h1>
    </header>

    <!-- =========================
         MAIN CONTAINER
    ========================== -->
    <div class="container">

        <!-- =========================
             NAVIGATION
        ========================== -->
        <nav>
            <a href="index.html">Course</a>
            <a href="project.html">Project</a>
            <a href="concept.html">Concepts</a>
            <a href="database.html">Database</a>
            <a href="doc.html">Documentation</a>
            <a href="dev.html">Dev Team</a>
            <a href="animation.html">Animation</a>
        </nav>

        <!-- =========================
             MAIN CONTENT AREA
        ========================== -->
        <main>
            <div class="animation-section">
                
                <h2>Final Project AND Logic Gate</h2>

                <!-- GATE IMAGE PREVIEW -->
                <div class="gate-image-container">
                    <img class="wide-img" id="myImage" src="and2off.png" alt="AND Gate Diagram">
                </div>

                <!-- INPUT 1 BUTTONS -->
                <p class="input-label">Input 1</p>
                <div class="gate-buttons gate-buttons-spaced">
                    <button type="button" onclick="input1 = 0; updateGate();">0 (OFF)</button>
                    <button type="button" onclick="input1 = 1; updateGate();">1 (ON)</button>
                </div>

                <!-- INPUT 2 BUTTONS -->
                <p class="input-label">Input 2</p>
                <div class="gate-buttons">
                    <button type="button" onclick="input2 = 0; updateGate();">0 (OFF)</button>
                    <button type="button" onclick="input2 = 1; updateGate();">1 (ON)</button>
                </div>

            </div>
        </main>

        <!-- RIGHT SPACER TO CENTER CONTENT -->
        <div class="right-space"></div>

    </div>

    <!-- =========================
         FOOTER
    ========================== -->
    <footer>
        <p><a href="project.html">Back to Home</a></p>
        <p>@ Powered by UB</p>
    </footer>

    <!-- =========================
         LOGIC GATE SCRIPT
    ========================== -->
    <script>
        let input1 = 0;
        let input2 = 0;

        function updateGate() {
            let input = input1 + "" + input2;

            if (input == "00") {
                document.getElementById("myImage").src = "and2off.png";
            }
            else if (input == "01") {
                document.getElementById("myImage").src = "andoffon.png";
            }
            else if (input == "10") {
                document.getElementById("myImage").src = "andonoff.png";
            }
            else if (input == "11") {
                document.getElementById("myImage").src = "and2on.png";
            }
        }
    </script>

</body>
</html>
