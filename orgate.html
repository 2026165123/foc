<!DOCTYPE html>
<html>

<head>
    <title>Project 3: OR Gate</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="or-gate-page">

    <header>
        <h1>Project 3: OR Gate</h1>
    </header>

    <main>

        <div class="input">

            <h2>Input 1</h2>

            <button onclick="
                input1 = 0;
                updateGate();
            ">
                0
            </button>

            <button onclick="
                input1 = 1;
                updateGate();
            ">
                1
            </button>


            <h2>Input 2</h2>

            <button onclick="
                input2 = 0;
                updateGate();
            ">
                0
            </button>

            <button onclick="
                input2 = 1;
                updateGate();
            ">
                1
            </button>

        </div>


        <div class="output">

            <h2>Output</h2>

            <div class="gate-box">

                <span id="inputValue" class="input-value">00</span>

                <img id="myImage" src="or2off.png">

                <span id="outputValue" class="output-value">0</span>

            </div>

        </div>

    </main>


    <footer>

            <a href="project.html">Back to Home</a><br></br>

        <p>@ Powered by UB</p>

    </footer>


    <script>

        let input1 = 0;
        let input2 = 0;

        function updateGate() {

            let input = input1 + "" + input2;

            document.getElementById("inputValue").innerHTML = input;

            if (input == "00") {

                document.getElementById("myImage").src = "or2off.png";
                document.getElementById("outputValue").innerHTML = "0";

            }

            else if (input == "01") {

                document.getElementById("myImage").src = "oroffon.png";
                document.getElementById("outputValue").innerHTML = "1";

            }

            else if (input == "10") {

                document.getElementById("myImage").src = "oronoff.png";
                document.getElementById("outputValue").innerHTML = "1";

            }

            else if (input == "11") {

                document.getElementById("myImage").src = "or2on.png";
                document.getElementById("outputValue").innerHTML = "1";

            }
        }

    </script>

</body>

</html>
