<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 5: ASCII</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- =========================
         HEADER
    ========================== -->
    <header>
        <h1>Project 5: ASCII Table</h1>
    </header>

    <!-- =========================
         MAIN CONTAINER
    ========================== -->
    <div class="container">

        <!-- =========================
             NAVIGATION
        ========================== -->
        <nav>
            <a href="index.html">Course</a>
            <a href="project.html">Project</a>
            <a href="concept.html">Concepts</a>
            <a href="database.html">Database</a>
            <a href="doc.html">Documentation</a>
            <a href="dev.html">Dev Team</a>
            <a href="animation.html">Animation</a>
        </nav>

        <!-- =========================
             MAIN CONTENT AREA
        ========================== -->
        <main>
            <div class="animation-section">
                
                <h2>ASCII Code Converter</h2>

                <div class="converter-container">
                    
                    <!-- ASCII TABLE CHART IMAGE -->
                    <img src="ascii.png" alt="ASCII Table Chart" class="converter-chart" style="width: 280px;">

                    <!-- CONVERTER FORM -->
                    <div class="converter-form">
                        <label for="asciiInput">Enter any number from 0 to 127 :</label>
                        <input type="text" id="asciiInput" placeholder="e.g. 65">
                        
                        <div class="gate-buttons">
                            <button type="button" onclick="convertAscii()">Submit</button>
                        </div>

                        <p class="converter-result">
                            ASCII Value : <span id="asciiOutput">-</span>
                        </p>
                    </div>

                </div>

            </div>
        </main>

        <!-- RIGHT SPACER TO CENTER CONTENT -->
        <div class="right-space"></div>

    </div>

    <!-- =========================
         FOOTER
    ========================== -->
    <footer>
        <p><a href="project.html">Back to Home</a></p>
        <p>@ Powered by UB</p>
    </footer>

    <!-- =========================
         CONVERTER SCRIPT
    ========================== -->
    <script>
        function convertAscii() {
            let numVal = parseInt(document.getElementById("asciiInput").value.trim());
            
            if (!isNaN(numVal) && numVal >= 0 && numVal <= 127) {
                // Convert decimal to ASCII character
                let charVal = String.fromCharCode(numVal);
                
                // Handle non-printable / space control codes visually
                if (numVal === 32) charVal = "(SPACE)";
                else if (numVal < 32 || numVal === 127) charVal = "(CONTROL CODE)";

                document.getElementById("asciiOutput").innerText = charVal;
            } else {
                document.getElementById("asciiOutput").innerText = "Invalid (Enter 0-127)";
            }
        }
    </script>

</body>
</html>
